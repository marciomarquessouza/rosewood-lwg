<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>

  <body>
    <img src="./splash.png" alt="Rosewood Content Manager" />
  </body>
</html>
